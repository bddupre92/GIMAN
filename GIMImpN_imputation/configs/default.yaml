# GIMIN - Default Configuration
# Graph-based Iterative Multimodal Imputation Network
# ===================================================
# NOTE: Column order MUST match the parquet file exactly.
# Zero-variance features dropped: LRRK2, GBA, APOE_E4, SNCA,
# GENETIC_RISK_SCORE (all constant 0), NP1RTOT (no observations).
# Total: 33 features (down from 39).

data_paths:
  raw_data_dir: "../../data/00_raw"
  processed_data_dir: "data/01_processed"
  interim_data_dir: "data/02_interim"
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"

graph:
  k_neighbors: 15
  similarity_metric: "cosine"
  min_overlap: 3
  graph_refinement_iterations: 3
  alpha_start: 1.0
  alpha_end: 0.5

model:
  embed_dim: 64
  num_gnn_layers: 3
  num_heads: 4
  mc_dropout_rate: 0.1

training:
  lr: 0.001
  weight_decay: 0.00001
  num_epochs: 200
  batch_mask_fraction: 0.2
  lambda_dist: 0.1
  lambda_cross: 0.10
  lambda_cal: 0.01
  cal_warmup_epochs: 50
  early_stopping_patience: 30

evaluation:
  eval_mask_fractions:
    - 0.1
    - 0.2
    - 0.3
    - 0.5
  eval_num_runs: 10
  mc_samples: 50

incremental:
  rebuild_interval: 100
  local_hop_count: 2

random_seed: 42

# Modality definitions -- order matches parquet column layout
modalities:
  - name: "demographics"
    features:
      - "SEX"
      - "AGE_AT_VISIT"

  - name: "motor_clinical"
    features:
      - "NP3TOT"
      - "NHY"
      - "PIGD_SCORE"
      - "TREMOR_SCORE"
      - "MCATOT"

  - name: "structural_imaging"
    features:
      - "CAUDATE_L_VOL"
      - "CAUDATE_R_VOL"
      - "PUTAMEN_L_VOL"
      - "PUTAMEN_R_VOL"
      - "HIPPOCAMPUS_L_VOL"
      - "HIPPOCAMPUS_R_VOL"

  - name: "spect_sbr"
    features:
      - "CAUDATE_L_SBR"
      - "CAUDATE_R_SBR"
      - "PUTAMEN_L_SBR"
      - "PUTAMEN_R_SBR"
      - "CAUDATE_ASYMMETRY"
      - "PUTAMEN_ASYMMETRY"

  - name: "csf_biomarkers"
    features:
      - "ALPHA_SYNUCLEIN"
      - "TOTAL_TAU"
      - "ABETA42"
      - "PTAU181"

  - name: "clinical_biomarkers"
    features:
      - "UPSIT_TOTAL"
      - "RBD_TOTAL"
      - "SCOPA_AUT_TOTAL"
      - "ESS_TOTAL"

  - name: "cortical_thickness"
    features:
      - "ENTORHINAL_L_CTH"
      - "ENTORHINAL_R_CTH"
      - "CINGULATE_L_CTH"
      - "CINGULATE_R_CTH"
      - "PRECENTRAL_L_CTH"
      - "PRECENTRAL_R_CTH"

# Per-modality normalization strategy
normalization:
  demographics: "zscore"
  motor_clinical: "rankgauss"
  structural_imaging: "log_zscore"
  spect_sbr: "log_zscore"
  csf_biomarkers: "rankgauss"
  clinical_biomarkers: "rankgauss"
  cortical_thickness: "log_zscore"

# Binary (0/1) feature indices in the flat feature vector
# SEX=0 (only true binary feature)
binary_feature_indices: [0]

# Cross-modal feature pairs for consistency loss
# Indices for 33-feature vector:
#  0:SEX 1:AGE 2:NP3TOT 3:NHY 4:PIGD 5:TREMOR 6:MCATOT
#  7-12: structural_imaging  13-18: spect_sbr
#  19-22: csf_biomarkers  23-26: clinical_biomarkers  27-32: cortical_thickness
cross_modal_pairs:
  # Structure-function (VOL <-> SBR)
  - [7, 13]   # CAUDATE_L_VOL <-> CAUDATE_L_SBR
  - [8, 14]   # CAUDATE_R_VOL <-> CAUDATE_R_SBR
  - [9, 15]   # PUTAMEN_L_VOL <-> PUTAMEN_L_SBR
  - [10, 16]  # PUTAMEN_R_VOL <-> PUTAMEN_R_SBR
  # Bilateral symmetry: structural volumes
  - [7, 8]    # CAUDATE_L_VOL <-> CAUDATE_R_VOL
  - [9, 10]   # PUTAMEN_L_VOL <-> PUTAMEN_R_VOL
  - [11, 12]  # HIPPOCAMPUS_L_VOL <-> HIPPOCAMPUS_R_VOL
  # Bilateral symmetry: SPECT SBR
  - [13, 14]  # CAUDATE_L_SBR <-> CAUDATE_R_SBR
  - [15, 16]  # PUTAMEN_L_SBR <-> PUTAMEN_R_SBR
  # Bilateral symmetry: cortical thickness
  - [27, 28]  # ENTORHINAL_L_CTH <-> ENTORHINAL_R_CTH
  - [29, 30]  # CINGULATE_L_CTH <-> CINGULATE_R_CTH
  - [31, 32]  # PRECENTRAL_L_CTH <-> PRECENTRAL_R_CTH
  # Biochemical relationship
  - [20, 22]  # TOTAL_TAU <-> PTAU181
  # Anatomical adjacency
  - [11, 27]  # HIPPOCAMPUS_L_VOL <-> ENTORHINAL_L_CTH
  - [12, 28]  # HIPPOCAMPUS_R_VOL <-> ENTORHINAL_R_CTH
  # Motor-imaging (disease severity <-> dopamine)
  - [3, 15]   # NHY <-> PUTAMEN_L_SBR
  - [3, 16]   # NHY <-> PUTAMEN_R_SBR
