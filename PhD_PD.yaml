    cellId: 019d5be3-b90b-7116-9de3-de8ca60cc53a # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: 14. Paper3 Longitudinal Features (48-col)
    config:
      labelStyle: AUTO
      cells:
        - cellType: SQL
          cellId: 019d5be3-e3b7-7116-9a4d-af988aea2917
          cellLabel: Paper3 Longitudinal Summary
          config:
            source: |
              SELECT
                  cohort,
                  nsd_stage,
                  count(*) AS n_visits,
                  count(DISTINCT patno) AS n_patients,
                  round(avg(updrs3_total)::numeric, 1) AS mean_updrs3,
                  round(avg(updrs2_total)::numeric, 1) AS mean_updrs2,
                  round(avg(updrs1_total)::numeric, 1) AS mean_updrs1,
                  round(avg(moca_total)::numeric, 1) AS mean_moca,
                  round(avg(scopa_aut_total)::numeric, 1) AS mean_scopa_aut,
                  round(avg(caudate_mean_sbr)::numeric, 2) AS mean_caudate_sbr,
                  round(avg(putamen_mean_sbr)::numeric, 2) AS mean_putamen_sbr,
                  round(avg(delta_updrs3_total)::numeric, 2) AS mean_delta_updrs3,
                  round(avg(delta_moca_total)::numeric, 2) AS mean_delta_moca
              FROM postgres.paper3.longitudinal_features
              GROUP BY cohort, nsd_stage
              ORDER BY cohort, nsd_stage
