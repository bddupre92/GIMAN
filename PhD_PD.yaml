    cellId: 019d5b4c-46ec-7771-84c4-3e0d6ed65e7f # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: 6. Genetic Risk Factors
    config:
      labelStyle: AUTO
      cells:
        - cellType: SQL
          cellId: 019d5b4c-7642-7115-aa07-68b4b60f8eac
          cellLabel: Genetic Carrier Status by Cohort
          config:
            source: |
              SELECT
                  cohort,
                  count(*) AS n_total,
                  sum(CASE WHEN lrrk2_carrier = 1 THEN 1 ELSE 0 END) AS n_lrrk2,
                  round(
                      100.0
                      * sum(CASE WHEN lrrk2_carrier = 1 THEN 1 ELSE 0 END)
                      / count(CASE WHEN lrrk2_carrier IS NOT NULL THEN 1 END),
                      1
                  ) AS pct_lrrk2,
                  sum(CASE WHEN gba_carrier = 1 THEN 1 ELSE 0 END) AS n_gba,
                  round(
                      100.0
                      * sum(CASE WHEN gba_carrier = 1 THEN 1 ELSE 0 END)
                      / count(CASE WHEN gba_carrier IS NOT NULL THEN 1 END),
                      1
                  ) AS pct_gba,
                  sum(CASE WHEN apoe_e4_carrier = 1 THEN 1 ELSE 0 END) AS n_apoe_e4,
                  round(
                      100.0
                      * sum(CASE WHEN apoe_e4_carrier = 1 THEN 1 ELSE 0 END)
                      / count(CASE WHEN apoe_e4_carrier IS NOT NULL THEN 1 END),
                      1
                  ) AS pct_apoe_e4
              FROM baseline_features
              WHERE cohort IS NOT NULL
              GROUP BY cohort
              ORDER BY n_total DESC
            dataFrameCell: true
            dataConnectionId: null
            resultVariableName: genetics_by_cohort
