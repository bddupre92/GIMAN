    cellId: 019d5b4b-4bb1-7006-9758-36245c580e17 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: 2. NSD-ISS Disease Staging
    config:
      labelStyle: AUTO
      cells:
        - cellType: SQL
          cellId: 019d5b4b-71fa-7117-8e1d-71743b87d5d1
          cellLabel: NSD-ISS Stage Distribution
          config:
            source: |
              SELECT
                  nsd_iss_stage,
                  nsd_iss_stage_numeric,
                  staging_confidence,
                  count(*) AS n_patients,
                  round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct,
                  round(avg(age_at_baseline)::numeric, 1) AS mean_age,
                  sum(CASE WHEN s_positive THEN 1 ELSE 0 END) AS n_synuclein_pos,
                  sum(CASE WHEN d_positive THEN 1 ELSE 0 END) AS n_dopamine_pos,
                  round(
                      avg(
                          updrs3_tremor + updrs3_rigidity + updrs3_bradykinesia + updrs3_axial
                      )::numeric,
                      1
                  ) AS mean_updrs3_total
              FROM baseline_features
              WHERE cohort IS NOT NULL
              GROUP BY nsd_iss_stage, nsd_iss_stage_numeric, staging_confidence
              ORDER BY nsd_iss_stage_numeric
            dataFrameCell: true
            dataConnectionId: null
            resultVariableName: stage_distribution
