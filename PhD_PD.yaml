        - cellType: SQL
          cellId: 019d5b4a-10a5-7551-9a04-c7f1e90fc26c
          cellLabel: Demographics by Cohort
          config:
            source: |-
              SELECT
                cohort,
                count(*) AS n,
                round(avg(age_at_baseline)::numeric, 1) AS mean_age,
                round(stddev(age_at_baseline)::numeric, 1) AS sd_age,
                round(min(age_at_baseline)::numeric, 1) AS min_age,
                round(max(age_at_baseline)::numeric, 1) AS max_age,
                sum(CASE WHEN sex = 0 THEN 1 ELSE 0 END) AS n_sex_0,
                sum(CASE WHEN sex IS NULL THEN 1 ELSE 0 END) AS n_sex_missing,
                round(avg(CASE WHEN handed = 0 THEN 1 WHEN handed = 1 THEN 0 ELSE NULL END)::numeric * 100, 1) AS pct_right_handed
              FROM baseline_features
              GROUP BY cohort
              ORDER BY n DESC
