        - cellType: SQL
          cellId: 019d5b49-dac0-7dda-9e72-decbf6eb87a9
          cellLabel: All Baseline Features
          config:
            source: |
              WITH l AS (
                  SELECT DISTINCT
                      patno,
                      cohort
                  FROM postgres.longitudinal.longitudinal_nsd_iss
              )
              SELECT
                  f.patno,
                  l.cohort,
                  f.nsd_iss_stage,
                  f.nsd_iss_stage_numeric,
                  f.sex,
                  f.handed,
                  f.age_at_baseline,
                  f.updrs1_total,
                  f.updrs2_total,
                  f.updrs3_tremor,
                  f.updrs3_rigidity,
                  f.updrs3_bradykinesia,
                  f.updrs3_axial,
                  f.updrs4_total,
                  f.moca_total,
                  f.rbd_total,
                  f.ess_total,
                  f.scopa_aut_total,
                  f.caudate_mean_sbr,
                  f.caudate_asymmetry,
                  f.caudate_putamen_ratio,
                  f.lrrk2_carrier,
                  f.gba_carrier,
                  f.apoe_e4_carrier,
                  f.staging_confidence,
                  f.functional_impairment_level,
                  f.s_positive,
                  f.d_positive
              FROM postgres.features.paper1_features_with_targets AS f
              LEFT JOIN l ON f.patno = l.patno
            dataFrameCell: false
            dataConnectionId: 019d5b44-2a3c-7115-b5f4-43722a8ff340
