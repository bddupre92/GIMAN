    cellId: 019d5b50-2e7d-7117-9659-b73312fc2710 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: 8. Feature Correlations & Distributions
    config:
      labelStyle: AUTO
      cells:
        - cellType: CODE
          cellId: 019d5b50-56f5-7116-8157-3a241f3068a7
          cellLabel: Correlation Heatmap
          config:
            source: |-
              import pandas as pd
              import numpy as np
              import matplotlib.pyplot as plt
              import seaborn as sns

              df = baseline_features.copy()

              numeric_cols = [
                  'age_at_baseline', 'updrs1_total', 'updrs2_total',
                  'updrs3_tremor', 'updrs3_rigidity', 'updrs3_bradykinesia', 'updrs3_axial',
                  'moca_total', 'rbd_total', 'ess_total', 'scopa_aut_total',
                  'caudate_mean_sbr', 'caudate_asymmetry', 'caudate_putamen_ratio'
              ]

              corr = df[numeric_cols].corr()

              fig, ax = plt.subplots(figsize=(14, 11))
              mask = np.triu(np.ones_like(corr, dtype=bool))
              sns.heatmap(
                  corr, mask=mask, annot=True, fmt='.2f', cmap='RdBu_r',
                  center=0, vmin=-1, vmax=1, square=True,
                  linewidths=0.5, ax=ax,
                  annot_kws={'size': 8}
              )
              ax.set_title('Correlation Matrix — Clinical Features & Biomarkers', fontsize=14, fontweight='bold')
              plt.tight_layout()
              plt.show()
