      cells:
        - cellType: SQL
          cellId: 019d5bdf-499b-7000-8b27-1f2bf2cd529a
          cellLabel: Full Table Inventory
          config:
            source: |-
              SELECT
                t.table_schema,
                t.table_name,
                count(c.column_name) AS n_columns
              FROM information_schema.tables t
              JOIN information_schema.columns c
                ON c.table_schema = t.table_schema AND c.table_name = t.table_name
              WHERE t.table_schema IN (
                'ppmi_raw','ppmi_loni','ppmi_supplemental',
                'biofind_raw','pdbp_raw','hbs_raw',
                'lcc_raw','lbd_raw','sure_pd3_raw',
                'staging','features','longitudinal','paper3'
              )
              AND t.table_type = 'BASE TABLE'
              GROUP BY t.table_schema, t.table_name
              ORDER BY t.table_schema, t.table_name
